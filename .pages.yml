# Pages CMS settings — https://pagescms.org
# Edit the menu and restaurant info at https://app.pagescms.org
# Every save is a commit to GitHub → Netlify redeploys ruchi.se automatically.
# Each menu category has its own section; the section decides the dish's category.

media:
- name: images
  label: Dish photos
  input: public/images
  output: /images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: menu-bowls
  label: Bowls
  type: file
  path: src/data/menu/bowls.json
  format: json
  list: true
  fields:
  - name: name
    label: Dish name
    type: string
    required: true
  - name: description
    label: Description
    type: text
  - name: price
    label: Price (kr)
    type: number
    required: true
  - name: priceFrom
    label: Show as "from" price
    description: Turn on for dishes with several sizes, e.g. "from 85 kr".
    type: boolean
    default: false
  - name: subcategories
    label: Subcategory
    type: select
    options:
      multiple: true
      values:
      - name: warm-options
        label: Warm Options
      - name: pick-your-protein
        label: Pick Your Protein
      - name: plant-based
        label: Plant Based
      - name: meat
        label: Meat
      - name: fish
        label: Fish
  - name: tags
    label: Tags
    type: select
    options:
      multiple: true
      values:
      - NEW
      - Popular
      - VGN
      - VEG
      - Vegan Option
      - GF
      - SPICY
  - name: available
    label: Show on menu
    description: Turn off to hide the dish (e.g. sold out or seasonal).
    type: boolean
    default: true
  - name: image
    label: Photo
    type: image
    options:
      media: images
