# Pages CMS settings — https://pagescms.org
# Edit the menu and restaurant info at https://app.pagescms.org
# Every save is a commit to GitHub → Netlify redeploys ruchi.se automatically.

media:
  - name: images
    label: Dish photos
    input: public/images
    output: /images
    extensions: [jpg, jpeg, png, webp]

content:
  - name: menu
    label: Menu
    type: file
    path: src/data/menu.json
    format: json
    list: true
    fields:
      - name: name
        label: Dish name
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: price
        label: Price (kr)
        type: number
        required: true

      - name: priceFrom
        label: Show as "from" price
        description: Turn on for dishes with several sizes, e.g. "from 85 kr".
        type: boolean
        default: false

      - name: categories
        label: Category
        type: select
        options:
          multiple: true
          values:
            - name: salads
              label: Bowls
            - name: bao
              label: Bao
            - name: sushi
              label: Sushi
            - name: sando
              label: Sando
            - name: sides
              label: Sides
            - name: drinks
              label: Drinks

      - name: subcategories
        label: Subcategory
        description: "Bowls: Warm Options, Pick Your Protein, Plant Based, Meat, Fish · Bao: Regular, Plant based · Sushi: Maki, Nigiri, Mix"
        type: select
        options:
          multiple: true
          values:
            - name: warm-options
              label: Warm Options
            - name: pick-your-protein
              label: Pick Your Protein
            - name: plant-based
              label: Plant Based
            - name: meat
              label: Meat
            - name: fish
              label: Fish
            - name: regular
              label: Regular
            - name: maki
              label: Maki
            - name: nigiri
              label: Nigiri
            - name: mix
              label: Mix

      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          values: [NEW, Popular, VGN, VEG, Vegan Option, GF, SPICY]

      - name: available
        label: Show on menu
        description: Turn off to hide the dish (e.g. sold out or seasonal).
        type: boolean
        default: true

      - name: image
        label: Photo
        type: image
        options:
          media: images

  - name: info
    label: Restaurant info
    type: file
    path: src/data/info.json
    format: json
    fields:
      - name: address
        label: Street address
        type: string
      - name: postalCity
        label: Postcode & city
        type: string
      - name: phone
        label: Phone number
        description: Written like 076-098 95 38 — the tap-to-call link is made automatically.
        type: string
      - name: hours
        label: Opening hours
        type: object
        list: true
        fields:
          - name: days
            label: Day(s)
            type: string
          - name: time
            label: Time
            description: e.g. 11:00–20:00 or Closed
            type: string
      - name: instagram
        label: Instagram link
        type: string
