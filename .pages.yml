  type: file
  path: src/data/info.json
  format: json
  fields:
  - name: address
    label: Street address
    type: string
  - name: postalCity
    label: Postcode & city
    type: string
  - name: phone
    label: Phone number
    description: Written like 076-098 95 38 — the tap-to-call link is made automatically.
    type: string
  - name: hours
    label: Opening hours
    type: object
    list: true
    fields:
    - name: days
      label: Day(s)
      type: string
    - name: time
      label: Time
      description: e.g. 11:00–20:00 or Closed
      type: string
  - name: instagram
    label: Instagram link
    type: string
